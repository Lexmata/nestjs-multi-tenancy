<!-- Header -->
<app-header (menuToggled)="toggleSidebar()" />

<!-- Sidebar -->
<app-sidebar [isOpen]="sidebarOpen()" (linkClicked)="closeSidebar()" />

<!-- Main Content -->
<main class="lg:ml-[280px] min-h-screen pt-16">
  <router-outlet />
</main>

<!-- Mobile Overlay -->
@if (sidebarOpen()) {
  <div class="mobile-overlay" (click)="closeSidebar()"></div>
}
