<div class="code-block-container">
  @if (title()) {
    <div class="code-title">
      {{ title() }}
    </div>
  }
  <pre class="code-pre" [class.has-title]="title()"><code
    #codeElement
    [class]="'language-' + language()"
    class="code-content"
  >{{ code() }}</code></pre>
  <button
    (click)="copyCode()"
    class="copy-button"
    [class.with-title]="title()"
    title="Copy to clipboard"
  >
    @if (copied()) {
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    } @else {
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    }
  </button>
</div>
